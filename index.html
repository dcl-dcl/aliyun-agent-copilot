<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ER 数据智能助手</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(135deg, #1E222D 0%, #2a3340 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .demo-container {
        padding: 40px 20px;
        text-align: center;
        width: 100%;
        max-width: 1200px;
        box-sizing: border-box;
      }

      .demo-title {
        color: white;
        font-size: 2.5rem;
        font-weight: 300;
        margin-bottom: 16px;
      }

      .demo-subtitle {
        color: rgba(255, 255, 255, 0.8);
        font-size: 1.2rem;
        margin-bottom: 40px;
      }

      .web-component-demo {
        margin: 40px auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        padding: 40px;
        max-width: 800px;
        min-height: 250px;
        position: static;
      }

      .demo-instructions {
        text-align: left;
        margin-bottom: 30px;
      }

      .demo-instructions h3 {
        color: #333;
        margin-bottom: 16px;
      }

      .demo-instructions ul {
        color: #666;
        line-height: 1.6;
      }

      .demo-instructions li {
        margin-bottom: 8px;
      }

      .profile-status {
        margin-bottom: 24px;
        padding: 16px 20px;
        background: #f5f7fa;
        border-radius: 8px;
        border: 1px solid #e8ecf0;
      }

      .profile-status__label {
        color: #333;
        font-weight: 500;
        margin-bottom: 12px;
        font-size: 20px;
      }

      .profile-status__body {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 36px;
        text-align: center;
      }

      .profile-status__caption {
        font-size: 13px;
        color: #888;
        white-space: nowrap;
      }

      .profile-status__value {
        font-size: 13px;
        font-weight: 400;
        color: #888;
        line-height: 1.4;
        overflow-wrap: anywhere;
        margin-top: 4px;
      }

      .profile-status__meta {
        font-size: 28px;
        font-weight: 700;
        color: #1677ff;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }

      .profile-status__error {
        color: #d4380d;
      }
    </style>
  </head>
  <body>
    <div class="demo-container">
      <h1 class="demo-title">ER 数据智能助手</h1>
      <p class="demo-subtitle">基于 ant-design-x-vue 的智能聊天助手 Web Component 演示</p>

      <!-- Web Component Test Area -->
      <div class="web-component-demo">
        <div class="profile-status">
          <div class="profile-status__label">当前用户</div>
          <div class="profile-status__body" id="profile-status">
            <span class="profile-status__caption">正在读取登录用户...</span>
          </div>
        </div>

        <div class="demo-instructions">
          <h3>测试说明：</h3>
          <ul>
            <li>右下角有 AI 助手按钮，点击可以打开聊天窗口</li>
            <li>支持流式 SSE 响应，实时显示 AI 回复</li>
            <li>支持思考过程展开查看</li>
            <li>使用 ant-design-x-vue 的 BubbleList 和 Sender 组件</li>
          </ul>
        </div>

        <!-- The Cohirer Web Component，支持通过 attribute 传参 -->
        <er-biz-x
          hidden
          endpoint="./api"
          bot-name="ER测试数据助手"
          welcome-text="你好，我是ER测试数据智能助手&#10;请将您要分析的数据或问题告诉我"
        ></er-biz-x>
      </div>
    </div>

    <!-- Load the Web Component script -->
    <script type="module" src="/src/main.ts"></script>
    <script type="module">
      function pickProfile(source) {
        if (!source || typeof source !== 'object') return null
        if (source.user_id || source.id) return {
          ...source,
          user_id: source.user_id || source.id,
        }

        const candidates = [
          source.data,
          source.objects,
          source.profile,
          source.my_profile,
          source.my_profiles,
          source.profiles,
          source.result,
        ]

        for (const candidate of candidates) {
          if (Array.isArray(candidate)) {
            const matched = candidate.find(item => item && typeof item === 'object' && (item.user_id || item.id))
            if (matched) return pickProfile(matched)
            continue
          }
          if (candidate && typeof candidate === 'object') {
            const matched = pickProfile(candidate)
            if (matched) return matched
          }
        }

        return null
      }

      function getDisplayName(profile) {
        return profile.name || profile.display_name || profile.user_name || profile.nickname || profile.email || ''
      }

      function renderCurrentUser(profile) {
        const status = document.getElementById('profile-status')
        status.replaceChildren()

        const content = document.createElement('div')

        const displayName = getDisplayName(profile)
        if (displayName) {
          const meta = document.createElement('div')
          meta.className = 'profile-status__meta'
          meta.textContent = displayName
          content.appendChild(meta)
        }

        const userId = document.createElement('div')
        userId.className = 'profile-status__value'
        userId.textContent = `user_id: ${profile.user_id}`
        content.appendChild(userId)

        status.appendChild(content)
      }

      function renderProfileError(message) {
        const status = document.getElementById('profile-status')
        status.replaceChildren()

        const error = document.createElement('span')
        error.className = 'profile-status__error'
        error.textContent = message
        status.appendChild(error)
      }

      function setCopilotVisible(visible) {
        const erBizX = document.querySelector('er-biz-x')
        if (erBizX) erBizX.hidden = !visible
      }

      function getCopilotElement() {
        return document.querySelector('er-biz-x')
      }

      function getProfileUrl() {
        const endpoint = getCopilotElement()?.getAttribute('endpoint') || './api'
        const resolvedEndpoint = new URL(endpoint.endsWith('/') ? endpoint : `${endpoint}/`, window.location.href)
        return new URL('/api/get_profile', resolvedEndpoint).toString()
      }

      function renderLoginRequired(status) {
        const suffix = status ? `（HTTP ${status}）` : ''
        renderProfileError(`请先登录 Starlinks 后再使用 ER 数据智能助手。${suffix}`)
      }

      function isFetchBlocked(error) {
        return error instanceof TypeError && error.message === 'Failed to fetch'
      }

      function createProfileApiError(response) {
        return new Error(`获取用户身份失败，HTTP 状态码：${response.status} ${response.statusText}`)
      }

      function buildBizParams(profile) {
        return {
          user_prompt_params: { user_id: String(profile.user_id) },
        }
      }

      function bindCurrentUser(profile) {
        const erBizX = getCopilotElement()
        if (!erBizX) throw new Error('未找到 ER 数据智能助手组件')
        erBizX.setAttribute('biz-params', JSON.stringify(buildBizParams(profile)))
        setCopilotVisible(true)
        renderCurrentUser(profile)
      }

      async function loadCurrentUser() {
        await customElements.whenDefined('er-biz-x')

        try {
          const response = await fetch(getProfileUrl(), {
            credentials: 'include',
            cache: 'no-store',
          })

          if (response.status === 401) {
            setCopilotVisible(false)
            renderLoginRequired(response.status)
            return
          }

          if (!response.ok) {
            throw createProfileApiError(response)
          }

          const payload = await response.json()
          const profile = pickProfile(payload)
          if (!profile?.user_id) {
            throw new Error('响应中未找到 user_id')
          }

          bindCurrentUser(profile)
        } catch (error) {
          setCopilotVisible(false)
          if (isFetchBlocked(error)) {
            renderProfileError(`无法连接登录态接口，请确认已登录 Starlinks，且网络或代理可用。`)
            return
          }
          const message = error instanceof Error ? error.message : String(error)
          renderProfileError(`无法获取当前用户：${message}`)
        }
      }

      loadCurrentUser()
    </script>
  </body>
</html>
