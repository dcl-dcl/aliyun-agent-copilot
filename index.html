<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ER 数据智能助手</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(135deg, #1E222D 0%, #2a3340 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .demo-container {
        padding: 40px 20px;
        text-align: center;
        width: 100%;
        max-width: 1200px;
        box-sizing: border-box;
      }

      .demo-title {
        color: white;
        font-size: 2.5rem;
        font-weight: 300;
        margin-bottom: 16px;
      }

      .demo-subtitle {
        color: rgba(255, 255, 255, 0.8);
        font-size: 1.2rem;
        margin-bottom: 40px;
      }

      .web-component-demo {
        margin: 40px auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        padding: 40px;
        max-width: 800px;
        min-height: 250px;
        position: static;
      }

      .demo-instructions {
        text-align: left;
        margin-bottom: 30px;
      }

      .demo-instructions h3 {
        color: #333;
        margin-bottom: 16px;
      }

      .demo-instructions ul {
        color: #666;
        line-height: 1.6;
      }

      .demo-instructions li {
        margin-bottom: 8px;
      }

      .user-switcher {
        margin-bottom: 24px;
        padding: 16px 20px;
        background: #f5f7fa;
        border-radius: 8px;
        border: 1px solid #e8ecf0;
      }

      .user-switcher-label {
        color: #333;
        font-weight: 500;
        margin-bottom: 12px;
        font-size: 20px;
      }

      .user-list {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .user-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        background: white;
        border: 2px solid #d0d7de;
        border-radius: 8px;
        cursor: pointer;
        transition: border-color 0.2s, box-shadow 0.2s;
        user-select: none;
      }

      .user-card:hover {
        border-color: #1677ff;
        box-shadow: 0 2px 8px rgba(22, 119, 255, 0.15);
      }

      .user-card.active {
        border-color: #1677ff;
        background: #e6f4ff;
      }

      .user-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #1677ff;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        flex-shrink: 0;
      }

      .user-card-info {
        text-align: left;
      }

      .user-card-name {
        font-size: 14px;
        font-weight: 600;
        color: #333;
        line-height: 1.3;
      }

      .user-card-level {
        font-size: 12px;
        color: #888;
        margin-top: 2px;
      }

      .current-user-display {
        display: none;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid #e8ecf0;
      }

      .current-user-display.visible {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .current-user-label {
        font-size: 13px;
        color: #888;
        white-space: nowrap;
      }

      .user-info-name {
        font-size: 1.5rem;
        font-weight: 700;
        color: #1677ff;
        line-height: 1.2;
      }

      .user-info-level {
        font-size: 1.1rem;
        font-weight: 600;
        color: #52c41a;
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <div class="demo-container">
      <h1 class="demo-title">ER 数据智能助手</h1>
      <p class="demo-subtitle">基于 ant-design-x-vue 的智能聊天助手 Web Component 演示</p>

      <!-- Web Component Test Area -->
      <div class="web-component-demo">
        <div class="user-switcher">
          <div class="user-switcher-label">模拟用户</div>
          <div class="user-list" id="user-list"></div>
        </div>

        <div class="demo-instructions">
          <h3>测试说明：</h3>
          <ul>
            <li>右下角有 AI 助手按钮，点击可以打开聊天窗口</li>
            <li>支持流式 SSE 响应，实时显示 AI 回复</li>
            <li>支持思考过程展开查看</li>
            <li>使用 ant-design-x-vue 的 BubbleList 和 Sender 组件</li>
          </ul>
        </div>

        <!-- The Cohirer Web Component，支持通过 attribute 传参 -->
        <er-biz-x
          endpoint="/api/chat"
          bot-name="ER测试数据助手"
          welcome-text="你好，我是ER测试数据智能助手&#10;请将您要分析的数据或问题告诉我"
        ></er-biz-x>
      </div>
    </div>

    <!-- Load the Web Component script -->
    <script type="module" src="/src/main.ts"></script>
    <script type="module">
      const USERS = [
        { user_id: '73220', level: 'Leader', name: 'Steven Cui' },
        { user_id: '73229', level: 'Leader', name: 'Taler Liu' },
        { user_id: '274442', level: 'Sub Leader', name: 'Rita Yang' },
        { user_id: '172214', level: '普通顾问', name: 'Yvonne Guo' },
        { user_id: '531315', level: '普通顾问', name: 'Sally Liu' },
      ]

      function onUserChange(card) {
        const erBizX = document.querySelector('er-biz-x')
        const infoDisplay = document.getElementById('user-info-display')
        const infoName = document.getElementById('user-info-name')
        const infoLevel = document.getElementById('user-info-level')

        // 更新选中状态
        document.querySelectorAll('.user-card').forEach(c => c.classList.remove('active'))
        card.classList.add('active')

        const user = JSON.parse(card.dataset.user)

        // 更新 biz-params
        erBizX.setAttribute('biz-params', JSON.stringify({
          user_prompt_params: { user_id: user.user_id }
        }))

        // 显示用户信息
        infoName.textContent = user.name
        infoLevel.textContent = user.level
        infoDisplay.classList.add('visible')
      }

      // 等待自定义元素升级完成后再渲染，避免重复执行
      customElements.whenDefined('er-biz-x').then(() => {
        const userList = document.getElementById('user-list')
        // 幂等保护：已初始化则跳过
        if (userList.children.length > 0) return

        USERS.forEach((user) => {
          const initials = user.name.split(' ').map(w => w[0]).join('')
          const card = document.createElement('div')
          card.className = 'user-card'
          card.dataset.user = JSON.stringify(user)
          card.innerHTML = `
            <div class="user-avatar">${initials}</div>
            <div class="user-card-info">
              <div class="user-card-name">${user.name}</div>
              <div class="user-card-level">${user.level}</div>
            </div>`
          card.addEventListener('click', () => onUserChange(card))
          userList.appendChild(card)
        })

        // 默认选中第一个用户
        onUserChange(userList.firstElementChild)
      })
    </script>
  </body>
</html>
